 const email=$("#l_email").value.trim().toLowerCase(),senha=$("#l_s").value;
 if(!email||!senha) return toast("Informe e-mail e senha");
 const b=$("#btnAuth");b.disabled=true;
 try{ const linha=await lerNuvem();
  if(!nuvemConfigurada(linha)){ b.disabled=false; return iniciar() }
  const c=linha.dados,u=c.users.find(x=>x.email===email);
  if(!u||!window.crypto||!crypto.subtle||await hash(senha,u.salt)!==u.hash){ b.disabled=false; return toast("E-mail ou senha inválidos") }
  nuvemLinha=linha; const manter=sincronizar(c); sess.u=S.users.find(x=>x.id===u.id)||null;
  if(!sess.u){ b.disabled=false; return toast("Não foi possível carregar o usuário") }
  nuvemOk=true; if(manter) save(); persist(); ui.tab="alunos"; render()
 }catch(err){ console.log(err); b.disabled=false; toast("Sem conexão com o servidor. Tente novamente.") } }
function sair(){ sess.u=null; nuvemOk=false; persist(); ui.tab="alunos"; draft=null; render(); scrollTo(0,0) }
const vConta=()=>`<section class="card"><h2>Minha conta</h2><p class="mut" style="margin:0 0 8px">Altere seu e-mail e/ou senha de acesso. Para confirmar, informe a senha atual.</p><div class="grid"><input id="c_email" type="email" value="${esc(sess.u.email)}" placeholder="E-mail"><input id="c_atual" type="password" placeholder="Senha atual" autocomplete="current-password"><input id="c_s1" type="password" placeholder="Nova senha (mín. 8) — opcional" autocomplete="new-password"><input id="c_s2" type="password" placeholder="Repita a nova senha" autocomplete="new-password"></div><div class="row"><button onclick="trocarConta()">Salvar alterações</button></div></section>`;

 if(await hash($("#c_atual").value,u.salt)!==u.hash) return toast("Senha atual incorreta");
 const email=$("#c_email").value.trim().toLowerCase(),s1=$("#c_s1").value,s2=$("#c_s2").value;

 u.email=email; sess.u=u; save(); render(); toast("Conta atualizada") }

function addSala(){const n=$("#ns").value.trim();if(!n)return toast("Informe o nome da sala");if(S.salas.some(s=>s.nome===n))return toast("Sala já existe");S.salas.push({id:uid(),nome:n,serie:$("#nsr").value});save();render()}
function gerarSalas(){const n=Math.min(12,Math.max(1,+$("#nt").value||5));let c=0;
 Object.keys(SER).forEach(k=>{for(let i=0;i<n;i++){const nome=`${SER[k]} ${String.fromCharCode(65+i)}`;if(!S.salas.some(s=>s.nome===nome)){S.salas.push({id:uid(),nome,serie:k});c++}}});save();render();toast(c+" sala(s) criada(s)")}
function delSala(id){S.salas=S.salas.filter(s=>s.id!==id);S.alunos=S.alunos.filter(a=>a.sala!==id);S.users.forEach(u=>u.salas=(u.salas||[]).filter(x=>x!==id));save();render()}
function novoAluno(nome,num,ra,dv){nome=(nome||"").trim();ra=(ra||"").trim();dv=(dv||"").trim();if(!nome||!ra||S.alunos.some(a=>a.ra===ra&&a.dv===dv))return false;S.alunos.push({id:uid(),nome,num:String(num||"").trim(),ra,dv,sala:ui.sala});return true}
function addAluno(){if(!novoAluno($("#a_nome").value,$("#a_num").value,$("#a_ra").value,$("#a_dv").value))return toast("Informe nome e RA (o RA não pode repetir)");save();render();$("#a_nome").focus()}
function colar(){let ok=0;$("#cola").value.split("\n").forEach(l=>{const c=l.split(/\t|;/);if(c.length>=3&&novoAluno(c[0],c[1],c[2],c[3]))ok++});save();render();toast(ok+" aluno(s) importado(s)")}
function upd(id,k,v){S.alunos.find(x=>x.id===id)[k]=v.trim();save()}
function delAluno(id){S.alunos=S.alunos.filter(a=>a.id!==id);Object.values(S.resp).forEach(r=>delete r[id]);save();render()}

 ${S.simulados.length?S.simulados.map(s=>`<div class="row" style="border-top:1px solid var(--line);padding-top:8px"><div style="flex:1;min-width:200px"><b>${esc(s.titulo)}</b><br><span class="mut">${SER[s.serie]} · ${esc(s.materia)} · ${s.gab.length} questões${s.data?" · "+s.data.split("-").reverse().join("/"):""}${pend(s)?` · <b style="color:var(--bad)">gabarito pendente (${s.gab.filter(g=>!g.c).length})</b>`:""}</span></div>

function setL(i,l,b){draft.gab[i].c=l;b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))}

 for(let i=a-1;i<Math.min(b,draft.gab.length);i++){if(draft.gab[i].m!==m)draft.gab[i].d="";draft.gab[i].m=m}render()}
/* ---------- CADASTRAR TURMA POR PDF / TXT ---------- */
const SITS="Ativo|Transferido|Remanejamento|Não Comparecimento|BAIXA - TRANSFERÊNCIA|TROCA ALUNO ENTRE CLASSES|TROCA ALUNO ENTRE ESCOLAS|[A-Za-zÀ-ú]+";
function parseLista(t){const rows=[],seen=new Set(),flat=t.replace(/\s+/g," ");
 const rx=new RegExp("(?:^|\\s)(\\d{1,3})\\s+([^\\d]+?)\\s+(\\d{9,13})\\s+([0-9Xx])(?=\\s|$)(?:\\s+([A-Za-z]{2})\\s+(\\d{2}/\\d{2}/\\d{4})\\s+("+SITS+"))?","gi");let m;
 while((m=rx.exec(flat))){const ra=m[3].padStart(12,"0"),dv=m[4].toUpperCase(),k=ra+dv,rep=seen.has(k);seen.add(k);
  rows.push({num:m[1],nome:m[2].replace(/\s+/g," ").trim(),ra,dv,sit:m[7]||"",rep});rx.lastIndex=m.index+m[0].length-1}
 return rows}
function salaDoArq(n){const m=String(n).match(/(?<!\d)([123])\s*[-_ ]\s*([A-Za-z])(?![A-Za-z])/);return m?{serie:m[1]+"EM",nome:SER[m[1]+"EM"]+" "+m[2].toUpperCase()}:null}
function mkGrupo(nomeArq,t){const rows=parseLista(t);if(!rows.length)return null;
 const d=salaDoArq(nomeArq.replace(/\.[^.]+$/,""))||salaDoArq(t.trim().split("\n").slice(0,2).join(" ")),ex=d&&S.salas.find(s=>s.nome===d.nome);
 rows.forEach(r=>{const x=S.alunos.find(a=>a.ra===r.ra&&a.dv===r.dv);r.ja=x?((S.salas.find(s=>s.id===x.sala)||{}).nome||"outra sala"):"";r.on=!r.ja&&!r.rep&&(!r.sit||/^ativo$/i.test(r.sit))});
 return{f:nomeArq,rows,dest:ex?ex.id:(d?"new":(ui.sala||"new")),nome:d?d.nome:"",serie:d?d.serie:"1EM"}}
async function impAlunosArq(inp){const fs=[...inp.files];inp.value="";if(!fs.length)return;const G=[],vazios=[];
 for(const f of fs){try{toast("Lendo "+f.name+"…");const g=mkGrupo(f.name,await arqTexto(f));g?G.push(g):vazios.push(f.name)}catch(e){return toast(e.message||"Não consegui ler "+f.name)}}
 ui.imp=(ui.imp||[]).concat(G);render();
 toast(G.length?`${G.length} lista(s) lida(s) — confira e clique em Cadastrar`+(vazios.length?` (sem alunos reconhecidos: ${vazios.join(", ")})`:""):"Não encontrei alunos nesse arquivo (PDF escaneado/imagem não funciona). Use a caixa de colar da planilha.")}
const sitsDe=g=>[...new Set(g.rows.map(r=>r.sit||"Sem situação"))];
function impCnt(){const G=ui.imp||[];let t=0;G.forEach((g,i)=>{const n=g.rows.filter(r=>r.on).length;t+=n;const e=document.getElementById("ic"+i);if(e)e.textContent=n});const e=document.getElementById("ict");if(e)e.textContent=t}
function impSit(i,k,v){const g=ui.imp[i],s=sitsDe(g)[k];g.rows.forEach(r=>{if((r.sit||"Sem situação")===s&&!r.ja&&!r.rep)r.on=v});render()}
function impDest(i,v){ui.imp[i].dest=v;render()}
function vImp(){const G=ui.imp||[],lab='style="padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;background:var(--soft);color:var(--pri)"';
 return `<section class="card"><h2>📄 Cadastrar turma por PDF</h2><p class="mut" style="margin:0 0 8px">Envie a lista de alunos de cada sala (PDF da Secretaria Escolar Digital ou TXT) — pode escolher vários arquivos de uma vez. Antes de cadastrar você confere tudo; por padrão só entram os alunos <b>Ativos</b>.</p>
 <div class="row"><label ${lab}>⬆ Escolher PDF(s) / TXT<input type="file" accept=".pdf,.txt" multiple hidden onchange="impAlunosArq(this)"></label>${G.length?`<button class="ghost" onclick="ui.imp=null;render()">Limpar</button>`:""}</div>
 ${G.map((g,i)=>{const ss=sitsDe(g);return `<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:8px"><div class="row"><b>${esc(g.f)}</b><span class="mut">${g.rows.length} aluno(s) na lista · <span id="ic${i}">${g.rows.filter(r=>r.on).length}</span> selecionado(s)</span></div>
 <div class="row"><span class="mut">Cadastrar em:</span><select onchange="impDest(${i},this.value)">${opts([...salasOrd().map(s=>[s.id,s.nome]),["new","➕ Nova sala…"]],g.dest)}</select>${g.dest==="new"?`<input placeholder="Nome da sala (ex.: 1ª EM B)" value="${esc(g.nome)}" oninput="ui.imp[${i}].nome=this.value" style="width:200px"><select onchange="ui.imp[${i}].serie=this.value">${serOpts(g.serie)}</select>`:""}</div>
 <div class="row"><span class="mut">Situação:</span>${ss.map((s,k)=>{const rs=g.rows.filter(r=>(r.sit||"Sem situação")===s),pod=rs.filter(r=>!r.ja&&!r.rep);return `<label class="chk"><input type="checkbox" ${pod.length&&pod.every(r=>r.on)?"checked":""} ${pod.length?"":"disabled"} onchange="impSit(${i},${k},this.checked)">${esc(s)} (${rs.length})</label>`}).join("")}</div>
 <div class="sc" style="max-height:340px;overflow:auto"><table><thead><tr><th></th><th>Nº</th><th>Nome</th><th>RA</th><th>Díg.</th><th>Situação</th><th></th></tr></thead><tbody>${g.rows.map((r,j)=>`<tr><td><input type="checkbox" ${r.on?"checked":""} ${r.ja||r.rep?"disabled":""} onchange="ui.imp[${i}].rows[${j}].on=this.checked;impCnt()"></td><td>${esc(r.num)}</td><td class="nm">${esc(r.nome)}</td><td>${esc(r.ra)}</td><td>${esc(r.dv)}</td><td>${esc(r.sit||"—")}</td><td class="mut">${r.ja?"já cadastrado em "+esc(r.ja):r.rep?"repetido na lista":""}</td></tr>`).join("")}</tbody></table></div></div>`}).join("")}
 ${G.length?`<div class="row" style="margin-top:10px"><button onclick="impConfirmar()">✅ Cadastrar <span id="ict">${G.reduce((t,g)=>t+g.rows.filter(r=>r.on).length,0)}</span> aluno(s)</button></div>`:""}</section>`}
function impConfirmar(){const G=ui.imp||[],alvo=[];
 for(const g of G){if(g.dest==="new"){if(!g.nome.trim())return toast("Informe o nome da sala de "+g.f)}else if(!S.salas.find(s=>s.id===g.dest))return toast("Escolha a sala de destino de "+g.f)}
 let n=0,pul=0,ult=null;
 G.forEach(g=>{const sel=g.rows.filter(r=>r.on);if(!sel.length)return;let sa;
  if(g.dest==="new"){const nome=g.nome.trim();sa=S.salas.find(s=>s.nome===nome);if(!sa){sa={id:uid(),nome,serie:g.serie};S.salas.push(sa)}}else sa=S.salas.find(s=>s.id===g.dest);
  sel.forEach(r=>{if(S.alunos.some(a=>a.ra===r.ra&&a.dv===r.dv)){pul++;return}S.alunos.push({id:uid(),nome:r.nome,num:r.num,ra:r.ra,dv:r.dv,sala:sa.id});n++});ult=sa.id});
 if(!n&&!pul)return toast("Nenhum aluno selecionado");
 save();ui.imp=null;if(ult)ui.sala=ult;render();toast(`${n} aluno(s) cadastrado(s)`+(pul?` — ${pul} já existia(m)`:""))}

const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
const MATRX={"Português":"L[ÍI]NGUA PORTUGUESA|PORTUGU[ÊE]S","Matemática":"MATEM[ÁA]TICA","Biologia":"BIOLOGIA","Química":"QU[ÍI]MICA","Física":"F[ÍI]SICA","Geografia":"GEOGRAFIA","História":"HIST[ÓO]RIA","Inglês":"L[ÍI]NGUA INGLESA|INGL[ÊE]S","Educação Financeira":"EDUCA[ÇC][ÃA]O FINANCEIRA"};
async function pdfLib(){if(window.pdfjsLib)return;
 await new Promise((ok,no)=>{const s=document.createElement("script");s.src=PDFJS+"pdf.min.js";s.onload=ok;s.onerror=()=>no(new Error("lib"));document.head.appendChild(s)});
 const w=await(await fetch(PDFJS+"pdf.worker.min.js")).text();pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:"text/javascript"}))}
async function arqTexto(f){if(!/\.pdf$/i.test(f.name))return await f.text();
 try{await pdfLib()}catch(e){throw new Error("Para ler PDF é preciso estar conectado à internet. Sem internet, cole o texto do gabarito na caixa abaixo.")}
 const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let out="";
 for(let p=1;p<=pdf.numPages;p++){const tc=await(await pdf.getPage(p)).getTextContent();let y=null,ln="";
  tc.items.forEach(it=>{const yy=it.transform[5];if(y!==null&&Math.abs(yy-y)>3){out+=ln.trim()+"\n";ln=""}ln+=it.str+(it.hasEOL?"\n":" ");y=yy});out+=ln.trim()+"\n"}
 return out}
function parseProva(t){t=t.replace(/\r/g,"");const pos={};let m;
 const rx=/QUEST[ÃA]O\s*(?:N[º°.]*\s*)?0*(\d{1,2})\b/gi;
 while((m=rx.exec(t))){const n=+m[1];if(n>=1&&n<=90&&!(n in pos))pos[n]=m.index}
 let n=Math.max(0,...Object.keys(pos).map(Number));
 if(!n){const lr=/^\s*0*(\d{1,2})\s*[.)]\s+\S/gm;let nx=1;while((m=lr.exec(t))){if(+m[1]===nx){pos[nx]=m.index;nx++}}n=nx-1}
 const hs=[];let off=0;
 t.split("\n").forEach(l=>{const s=l.trim();if(s&&s.length<=70)for(const mt in MATRX){if(new RegExp("^(?:prova de |componente curricular:? |disciplina:? |[áa]rea:? )?(?:"+MATRX[mt]+")(?:\\s*[-–:(].*)?$","i").test(s)){hs.push([off,mt]);break}}off+=l.length+1});
 const mats=[];let cur=hs.length?hs[0][1]:"Português";
 for(let q=1;q<=n;q++){if(q in pos){const h=hs.filter(x=>x[0]<=pos[q]).pop();cur=h?h[1]:(hs.length?hs[0][1]:cur)}mats.push(cur)}
 const sm=t.match(/(\d)\s*[ªaº°]?\s*s[ée]rie/i)||t.match(/(\d)\s*[ºo°ª]?\s*ano\s+do\s+ensino\s+m[ée]dio/i);
 const tl=t.split("\n").map(x=>x.trim()).find(x=>x&&x.length<=100&&/simulado/i.test(x));
 return{n,mats,serie:sm&&SER[sm[1]+"EM"]?sm[1]+"EM":"",titulo:tl||""}}
function parseGab(t,allowSeq){t=t.replace(/\r/g,"");const map={};
 t.split("\n").forEach(l=>{const c=l.split(/\t|;|,/).map(x=>x.trim());
  if(c.length>=2&&/^\d{1,2}$/.test(c[0])&&/^[A-Ea-e]$/.test(c[1])){const q=+c[0];if(q>=1&&q<=90&&!map[q])map[q]={c:c[1].toUpperCase(),m:MAT.includes(c[2])?c[2]:"",d:c[3]||""}}});
 if(Object.keys(map).length)return map;
 const gi=t.search(/gabarito/i);let s=(gi>=0?t.slice(gi):t).replace(/quest[ãa]o/gi," ").replace(/\bQ\.?\s*(?=\d)/g," ");
 const rx=/(^|[^\dA-Za-zÀ-ú])0*(\d{1,2})(?:\s*[-–—.):=]\s*([A-Ea-e])|\s+([A-E]))(?![A-Za-zÀ-ú0-9])/g;let m;
 while((m=rx.exec(s))){const q=+m[2];if(q>=1&&q<=90&&!map[q])map[q]={c:(m[3]||m[4]).toUpperCase(),m:"",d:""};rx.lastIndex=m.index+m[0].length-1}
 if(Object.keys(map).length>=3||!allowSeq)return map;
 const sq=(s.match(/(?:^|\s)(?:[A-E][\s,;.-]*){8,}(?=\s|$)/g)||[]).map(x=>x.replace(/[^A-E]/g,"")).sort((a,b)=>b.length-a.length)[0];
 if(sq)sq.split("").slice(0,90).forEach((c,i)=>map[i+1]={c,m:"",d:""});
 return map}
function aplicaGab(map){const ks=Object.keys(map).map(Number);if(!ks.length)return 0;const mx=Math.min(90,Math.max(...ks));
 while(draft.gab.length<mx)draft.gab.push(blank());let n=0;
 ks.forEach(q=>{if(q>draft.gab.length)return;const g=draft.gab[q-1],x=map[q];g.c=x.c;if(x.m&&x.m!==g.m){g.m=x.m;g.d=""}if(x.d)g.d=x.d;n++});return n}
async function impProva(inp){const f=inp.files[0];inp.value="";if(!f)return;
 try{toast("Lendo "+f.name+"…");const t=await arqTexto(f),r=parseProva(t);
  if(!r.n)return toast("Não achei questões numeradas nesse arquivo. Defina o nº de questões e as matérias manualmente.");
  const old=draft.gab;draft.gab=r.mats.map((m,i)=>({c:(old[i]&&old[i].c)||"",d:"",m}));
  if(!draft.titulo.trim())draft.titulo=r.titulo||f.name.replace(/\.[^.]+$/,"").replace(/[_]+/g," ");
  if(r.serie)draft.serie=r.serie;
  const li=t.toLowerCase().lastIndexOf("gabarito");let g=0;if(li>=0)g=aplicaGab(parseGab(t.slice(li)));
  render();toast(`${r.n} questão(ões) lidas`+(g?` e ${g} resposta(s) do gabarito`:". Agora importe o gabarito ou preencha abaixo")+" — confira antes de salvar")}
 catch(e){toast(e.message||"Não consegui ler o arquivo")}}
async function impGabArq(inp){const f=inp.files[0];inp.value="";if(!f)return;
 try{toast("Lendo "+f.name+"…");const n=aplicaGab(parseGab(await arqTexto(f),true));
  if(!n)return toast("Não consegui identificar as respostas. Cole o texto na caixa abaixo ou use o gabarito rápido.");
  render();const f2=draft.gab.filter(g=>!g.c).length;toast(`${n} resposta(s) importada(s)`+(f2?` — ${f2} questão(ões) ainda sem gabarito`:" — confira e salve"))}
 catch(e){toast(e.message||"Não consegui ler o arquivo")}}
function impGab(){const n=aplicaGab(parseGab($("#gcola").value,true));render();toast(n?n+" questão(ões) importada(s)":"Nada reconhecido. Use o formato: 1-A, 2-B… ou Questão;Letra;Matéria;Descritor")}
function salvarSim(){const d=draft;if(!d.titulo.trim())return toast("Informe o título");const ms=[...new Set(d.gab.map(g=>g.m))];
 const o={id:d.id||uid(),titulo:d.titulo.trim(),serie:d.serie,materia:ms.length>1?"Várias matérias":ms[0],data:d.data,gab:d.gab.map(g=>({c:g.c,d:g.d,m:g.m}))};
 const i=S.simulados.findIndex(s=>s.id===o.id);i<0?S.simulados.push(o):S.simulados[i]=o;ui.nsim=o.id;save();draft=null;render();const p=o.gab.filter(g=>!g.c).length;toast(p?`Salvo — falta o gabarito de ${p} questão(ões)`:"Simulado salvo")}
function editSim(id){const s=S.simulados.find(x=>x.id===id);draft=JSON.parse(JSON.stringify(s));draft.gab.forEach(g=>g.m=g.m||s.materia);render();scrollTo(0,0)}
function delSim(id){S.simulados=S.simulados.filter(s=>s.id!==id);delete S.resp[id];save();render()}
function expSim(id){const s=S.simulados.find(x=>x.id===id),desc={};s.gab.forEach(g=>{const m=mq(s,g);if(dl(m).length)desc[m]=dl(m)});salvarArq(s.titulo+".json",JSON.stringify({titulo:s.titulo,serie:s.serie,materia:s.materia,data:s.data,gab:s.gab.map(g=>({c:g.c,d:g.d,m:mq(s,g)})),desc}))}
function importarSim(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result),lista=o.simulados||[o];
 lista.forEach(s=>{if(!s.titulo||!SER[s.serie]||!Array.isArray(s.gab)||!s.gab.length)throw 0});
 lista.forEach(s=>S.simulados.push({id:uid(),titulo:s.titulo,serie:s.serie,materia:s.materia||"Várias matérias",data:s.data||"",gab:s.gab.map(g=>({c:/^[A-E]$/.test(g.c)?g.c:"",d:g.d||"",m:MAT.includes(g.m)?g.m:"Português"}))}));
 const ds=o.desc||{};Object.keys(ds).forEach(m=>{S.desc[m]=S.desc[m]||[];ds[m].forEach(x=>{if(!S.desc[m].some(y=>y[0]===x[0]))S.desc[m].push(x)})});
 save();render();toast(lista.length+" simulado(s) importado(s)")}catch(e){toast("Arquivo de simulado inválido")}};r.readAsText(f);inp.value=""}

 return `<section class="card"><h2>Descritores / habilidades</h2><p class="mut" style="margin:0 0 6px">Cadastre os descritores oficiais por matéria (nada vem pré-preenchido, exceto Educação Financeira).</p>

const curSim=()=>S.simulados.find(s=>s.id===ui.nsim),cls=(v,c)=>!v||!c?"":v===c?"ok":"bad";
function calc(sim,aid){const r=(S.resp[sim.id]||{})[aid]||[];const tem=r.some(Boolean);const ac=tem?sim.gab.filter((g,i)=>g.c&&r[i]===g.c).length:0;return{r,tem,ac,er:tem?sim.gab.length-ac:0}}
const tot=(sim,c)=>pend(sim)?(c.tem?"•":""):c.tem?`${c.ac}/${sim.gab.length}`:"";
function vNotas(){if(!S.simulados.length)return `<section class="card mut">Cadastre ou importe um simulado primeiro.</section>`;
 const sim=curSim()||S.simulados[0];ui.nsim=sim.id;const sl=salasOrd().filter(s=>s.serie===sim.serie);if(!sl.find(s=>s.id===ui.nsala))ui.nsala=sl[0]&&sl[0].id;
 const al=ui.nsala?alunosDe(ui.nsala):[],gr=[];sim.gab.forEach(g=>{const m=mq(sim,g),l=gr[gr.length-1];l&&l[0]===m?l[1]++:gr.push([m,1])});
 return `<section class="card"><div class="row"><select style="flex:1" onchange="ui.nsim=this.value;render()">${opts(S.simulados.map(s=>[s.id,`${s.titulo} · ${SER[s.serie]}`]),sim.id)}</select></div>
 ${pend(sim)?`<div class="warn">Gabarito pendente em ${sim.gab.filter(g=>!g.c).length} questão(ões). Você já pode lançar as respostas dos alunos; a correção (verde/vermelho e total) aparece quando o gabarito for preenchido em “Cadastrar simulado → Editar / gabarito”.</div>`:""}
 <p class="mut" style="margin:4px 0">Digite A–E em cada célula (avança sozinho; setas, Enter e Backspace navegam). Salva automaticamente.</p></section>
 ${!sl.length?`<section class="card mut">Não há salas de ${SER[sim.serie]}. Crie na aba de alunos.</section>`:`<div class="tabs">${sl.map(s=>`<button class="tab ${s.id===ui.nsala?"on":""}" onclick="ui.nsala='${s.id}';render()">${esc(s.nome)}</button>`).join("")}</div>
 <div class="sc" style="max-height:70vh"><table class="sheet"><thead><tr class="gh"><th colspan="3"></th>${gr.map(x=>`<th colspan="${x[1]}">${esc(x[0])}</th>`).join("")}<th></th></tr><tr><th>Nº</th><th>Nome</th><th>RA-Díg.</th>${sim.gab.map((g,i)=>`<th>${i+1}</th>`).join("")}<th>Acertos</th></tr>
 <tr class="gab"><td colspan="3" style="text-align:right">Gabarito</td>${sim.gab.map(g=>`<td>${g.c||"?"}</td>`).join("")}<td></td></tr></thead>
 <tbody>${al.map(a=>{const c=calc(sim,a.id);return `<tr><td>${esc(a.num)}</td><td class="nm">${esc(a.nome)}</td><td>${esc(a.ra)}-${esc(a.dv)}</td>${sim.gab.map((g,i)=>{const v=c.r[i]||"";return `<td><input class="c ${cls(v,g.c)}" maxlength="1" data-a="${a.id}" data-q="${i}" value="${v}" oninput="cell(this)" onkeydown="key(event,this)" autocomplete="off"></td>`}).join("")}<td class="tot" id="t-${a.id}">${tot(sim,c)}</td></tr>`}).join("")}</tbody>
 <tfoot><tr><td colspan="3" style="text-align:right">% de acerto</td>${sim.gab.map((g,i)=>`<td id="f-${i}"></td>`).join("")}<td></td></tr></tfoot></table></div>`}`}
function cell(el){const sim=curSim(),aid=el.dataset.a,i=+el.dataset.q;const v=el.value.toUpperCase();if(v&&!/^[A-E]$/.test(v)){el.value="";return}el.value=v;
 const R=(S.resp[sim.id]=S.resp[sim.id]||{});const r=(R[aid]=R[aid]||[]);r[i]=v;if(!r.some(Boolean))delete R[aid];save();
 el.className="c "+cls(v,sim.gab[i].c);$("#t-"+aid).textContent=tot(sim,calc(sim,aid));footer();
 if(v){const n=el.parentElement.nextElementSibling.querySelector("input");if(n){n.focus();n.select()}}}
function key(e,el){const td=el.parentElement;let t=null;
 if(e.key==="ArrowRight")t=td.nextElementSibling;else if(e.key==="ArrowLeft"||(e.key==="Backspace"&&!el.value))t=td.previousElementSibling;
 else if(e.key==="ArrowDown"||e.key==="Enter"){const tr=td.parentElement.nextElementSibling;t=tr&&tr.children[td.cellIndex]}
 else if(e.key==="ArrowUp"){const tr=td.parentElement.previousElementSibling;t=tr&&tr.children[td.cellIndex]}
 const n=t&&t.querySelector&&t.querySelector("input");if(n){e.preventDefault();n.focus();n.select()}}
function footer(){const sim=curSim();if(!sim)return;const cs=alunosDe(ui.nsala).map(a=>calc(sim,a.id)).filter(c=>c.tem);
 sim.gab.forEach((g,i)=>{const e=document.getElementById("f-"+i);if(e)e.textContent=cs.length&&g.c?Math.round(cs.filter(c=>c.r[i]===g.c).length/cs.length*100):"–"})}

/* ---------- RESULTADOS ---------- */
function stats(sim,sid){const sl=visSalas().filter(s=>s.serie===sim.serie&&(!sid||s.id===sid));const al=sl.flatMap(s=>alunosDe(s.id));
 const part=al.map(a=>Object.assign({a,s:sl.find(x=>x.id===a.sala)},calc(sim,a.id))).filter(x=>x.tem);
 const errQ=sim.gab.map((g,i)=>part.filter(p=>p.r[i]!==g.c).length),nq={},ed={},bym={};
 sim.gab.forEach((g,i)=>{const m=mq(sim,g),k=m+"|"+(g.d||"");nq[k]=(nq[k]||0)+1;ed[k]=(ed[k]||0)+errQ[i];const b=bym[m]=bym[m]||{h:0,t:0};b.t+=part.length;b.h+=part.length-errQ[i]});
 const desc=Object.keys(ed).map(k=>{const[m,d]=k.split("|");return{m,d,e:ed[k],p:part.length?ed[k]/(part.length*nq[k])*100:0}}).sort((a,b)=>b.p-a.p);
 return{al,part,errQ,desc,bym,sl}}
const bars=rows=>rows.length?rows.map(r=>`<div class="bar"><span title="${esc(r[0])}">${esc(r[0])}</span><i style="width:${Math.max(2,r[1])*0.5}%"></i><span>${Math.round(r[1])}%</span></div>`).join(""):`<p class="mut">Sem dados.</p>`;
const dname=(m,d)=>{if(!d)return m+" · sem descritor";const f=dl(m).find(x=>x[0]===d);return `${m} · ${d}${f?" · "+f[1]:""}`};
function vRes(){const lista=S.simulados.filter(s=>visSalas().some(x=>x.serie===s.serie));
 if(!lista.length)return `<section class="card mut">${isC()?"Cadastre ou importe um simulado primeiro.":"Nenhum simulado disponível para as suas salas."}</section>`;
 const sim=lista.find(s=>s.id===ui.rsim)||lista[0];ui.rsim=sim.id;const sl=visSalas().filter(s=>s.serie===sim.serie);if(ui.rsala&&!sl.find(s=>s.id===ui.rsala))ui.rsala="";
 const head=`<section class="card"><div class="row"><select style="flex:1" onchange="ui.rsim=this.value;render()">${opts(lista.map(s=>[s.id,`${s.titulo} · ${SER[s.serie]}`]),sim.id)}</select>
 <select onchange="ui.rsala=this.value;render()"><option value="">${isC()?"Todas as salas":"Minhas salas"}</option>${opts(sl.map(s=>[s.id,s.nome]),ui.rsala)}</select>${isC()?`<button onclick="exportar()">⬇ Exportar Excel</button>`:""}</div></section>`;
 if(pend(sim))return head+`<div class="warn">Este simulado está com o gabarito incompleto (${sim.gab.filter(g=>!g.c).length} questão(ões) sem resposta correta). Complete em “Cadastrar simulado → Editar / gabarito” para ver os resultados.</div>`;
 const st=stats(sim,ui.rsala),n=st.part.length,med=n?st.part.reduce((t,p)=>t+p.ac,0)/n:0;
 return head+`<div class="cards"><div class="kpi">Média de acertos<b>${med.toFixed(1)}<small class="mut"> / ${sim.gab.length}</small></b></div><div class="kpi">Participação<b>${st.al.length?Math.round(n/st.al.length*100):0}%</b><span class="mut">${n} de ${st.al.length} alunos</span></div>
 <div class="kpi">Aproveitamento<b>${n?Math.round(med/sim.gab.length*100):0}%</b></div></div>
 <div class="two"><section class="card"><h2>% de acerto por matéria</h2>${bars(Object.keys(st.bym).map(m=>[m,st.bym[m].t?st.bym[m].h/st.bym[m].t*100:0]))}</section>
 <section class="card"><h2>Descritores mais errados (% de erro)</h2>${bars(st.desc.slice(0,10).map(d=>[dname(d.m,d.d),d.p]))}</section>
 <section class="card"><h2>Questões mais erradas (% de erro)</h2>${bars(st.errQ.map((e,i)=>["Q"+(i+1)+" · "+mq(sim,sim.gab[i])+(sim.gab[i].d?" · "+sim.gab[i].d:""),n?e/n*100:0]).sort((a,b)=>b[1]-a[1]).slice(0,10))}</section></div>
 <section class="card"><h2>Ranking de alunos</h2><div class="sc"><table><thead><tr><th>Nº</th><th>Nome</th><th>Sala</th><th>Acertos</th><th>Erros</th><th>%</th></tr></thead><tbody>${[...st.part].sort((a,b)=>b.ac-a.ac).map(p=>`<tr><td>${esc(p.a.num)}</td><td class="nm">${esc(p.a.nome)}</td><td>${esc(p.s&&p.s.nome)}</td><td>${p.ac}</td><td>${p.er}</td><td>${Math.round(p.ac/sim.gab.length*100)}%</td></tr>`).join("")||`<tr><td colspan="6" class="mut">Nenhuma nota lançada ainda.</td></tr>`}</tbody></table></div></section>`}

async function salvarArq(nome,data){nome=nome.replace(/[\\/:*?"<>|]/g,"-");const d=window.claude&&claude.use?await claude.use("downloads"):null;
 if(d){try{await d.save({filename:nome,data});toast("Arquivo pronto")}catch(e){if(!e||e.code!=="declined")toast("Não foi possível baixar")}return}
 const a=document.createElement("a");a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=nome;document.body.appendChild(a);a.click();a.remove();toast("Arquivo gerado")}
async function exportar(){const sim=S.simulados.find(s=>s.id===ui.rsim);if(!sim||pend(sim))return;if(!window.XLSX)return toast("Biblioteca Excel não carregou (precisa de internet)");
 const wb=XLSX.utils.book_new(),all=stats(sim,"");
 all.sl.forEach(s=>{const rows=alunosDe(s.id).map(a=>({a,c:calc(sim,a.id)})).filter(x=>x.c.tem).map(({a,c})=>Object.assign({Nome:a.nome,"Nº Chamada":a.num,RA:a.ra,"Dígito RA":a.dv,Sala:s.nome},...sim.gab.map((g,i)=>({["Q"+(i+1)]:c.r[i]||""})),{Acertos:c.ac,Erros:c.er}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{Aviso:"Sem notas lançadas"}]),s.nome.slice(0,31))});
